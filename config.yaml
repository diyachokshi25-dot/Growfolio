sources:
  - id: hdfc_amc
    title: HDFC Mutual Fund overview
    url: https://groww.in/mutual-funds/amc/hdfc-mutual-funds
  - id: hdfc_large_cap
    title: HDFC Large Cap Fund Direct Growth
    url: https://groww.in/mutual-funds/hdfc-large-cap-fund-direct-growth
  - id: hdfc_flexi_cap
    title: HDFC Flexi Cap Direct Plan Growth
    url: https://groww.in/mutual-funds/hdfc-equity-fund-direct-growth
  - id: hdfc_elss
    title: HDFC ELSS Tax Saver Fund Direct Plan Growth
    url: https://groww.in/mutual-funds/hdfc-elss-tax-saver-fund-direct-plan-growth
  - id: hdfc_mid_cap
    title: HDFC Mid Cap Fund Direct Growth
    url: https://groww.in/mutual-funds/hdfc-mid-cap-fund-direct-growth

scraping:
  user_agent: Mozilla/5.0 (compatible; MutualFundFAQDemo/1.0)
  timeout_seconds: 30
  max_response_bytes: 10485760

chunking:
  max_chars: 700

embedding:
  provider: sentence-transformers
  model: sentence-transformers/all-MiniLM-L6-v2

vector_db:
  provider: chromadb
  persist_directory: data/04_vector_db/chroma
  collection_name: hdfc_mutual_fund_faq

retrieval:
  top_k: 4
  max_distance: 0.9

deployment:
  vector_store: bundled_index
  embedding_provider: tfidf
  embedding_model: tfidf-v1

llm:
  providers:
    groq:
      model: openai/gpt-oss-20b
      api_key_env: GROQ_API_KEY
      endpoint: https://api.groq.com/openai/v1/chat/completions
